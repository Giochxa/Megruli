server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Load nginx's standard MIME type map first (text/html, text/css, application/javascript,
    # etc.) — declaring a `types {}` block replaces the type map entirely rather than adding to
    # it, so skipping this `include` was serving every file, including index.html itself, with
    # the wrong Content-Type and making the browser download it instead of rendering it.
    # The standard nginx MIME map already declares .wasm as application/wasm.
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
